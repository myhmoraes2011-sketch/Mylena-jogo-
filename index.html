<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Vida Real - Paraná Open World</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; user-select: none; background: #000; }
    
    /* HUD de Status do Jogador */
    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(15, 23, 42, 0.88);
      color: #fff;
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.12);
      min-width: 240px;
      z-index: 10;
    }
    #hud h3 { margin: 0 0 8px 0; color: #38bdf8; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; }
    .stat-row { display: flex; justify-content: space-between; gap: 15px; font-size: 13px; margin-bottom: 5px; }
    .stat-val { font-weight: bold; color: #4ade80; }
    
    /* Bars */
    .bar-container { width: 100%; background: #334155; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
    .bar-fill { height: 100%; background: #22c55e; transition: width 0.3s; }

    /* Velocímetro e GPS */
    #dashboard {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      padding: 10px 25px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.2);
      font-weight: bold;
      font-size: 15px;
      display: flex;
      gap: 15px;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      z-index: 10;
    }

    /* Painel de Ações e Botões Clicáveis */
    #action-panel {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      font-size: 13px;
    }
    .btn:hover { background: #1d4ed8; transform: translateY(-2px); }
    .btn-secondary { background: #475569; }
    .btn-secondary:hover { background: #334155; }

    /* Toast */
    #toast {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #22c55e;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 20;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- HUD Principal -->
  <div id="hud">
    <h3 id="location-name">Curitiba</h3>
    <div class="stat-row"><span>Dinheiro:</span> <span class="stat-val" id="money-display">R$ 5.000</span></div>
    <div class="stat-row"><span>Emprego:</span> <span id="job-display">Desempregado</span></div>
    <div class="stat-row"><span>Energia:</span> <span id="energy-val">100%</span></div>
    <div class="bar-container"><div id="energy-bar" class="bar-fill" style="width: 100%;"></div></div>
    <div class="stat-row"><span>Horário:</span> <span id="time-display" style="color: #fde047;">12:00</span></div>
  </div>

  <!-- Dashboard / GPS -->
  <div id="dashboard">
    <span id="speedometer">0 km/h</span>
    <span>|</span>
    <span id="gps-next">Próxima: Ponta Grossa (2000m)</span>
  </div>

  <!-- Botões de Ação na Tela -->
  <div id="action-panel">
    <button class="btn" onclick="workJob()">💼 Trabalhar (+R$ 250)</button>
    <button class="btn btn-secondary" onclick="toggleHeadlights()">💡 Faróis (F)</button>
    <button class="btn btn-secondary" onclick="interactEnvironment()">🚪 Interagir / Entrar (E)</button>
  </div>

  <div id="toast">Notificação</div>

  <script>
    // --- ESTADO GLOBAL DO JOGO ---
    const gameState = {
      money: 5000,
      energy: 100,
      job: 'Entregador Urbano',
      currentLocation: 'Curitiba',
      inVehicle: false,
      speed: 0,
      maxSpeed: 2.8, // Velocidade máxima alta (~330 km/h)
      headlightsOn: false,
      rentedHouse: false,
      timeOfDay: 12.0 // Hora em formato decimal (0 a 24)
    };

    // --- SETUP TENA E CÂMERA ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x38bdf8);
    scene.fog = new THREE.FogExp2(0x38bdf8, 0.002);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // --- ILUMINAÇÃO E CICLO DIA/NOITE ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xffffff, 1.0);
    sun.position.set(200, 300, 100);
    sun.castShadow = true;
    scene.add(sun);

    // --- MUNDO, RODOVIA E CIDADES ---
    // Terreno Extenso
    const groundGeo = new THREE.PlaneGeometry(3000, 10000);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x15803d });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Rodovia BR Conectando do Z=0 até Z=-7000
    const roadGeo = new THREE.PlaneGeometry(28, 10000);
    const roadMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.y = 0.02;
    scene.add(road);

    // Linha Central
    const lineGeo = new THREE.PlaneGeometry(0.8, 10000);
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xeab308 });
    const roadLine = new THREE.Mesh(lineGeo, lineMat);
    roadLine.rotation.x = -Math.PI / 2;
    roadLine.position.y = 0.03;
    scene.add(roadLine);

    // Construtor de Cidades ao longo da Z
    function createCity(z, cityName, colorHex) {
      const cityGroup = new THREE.Group();
      
      for (let i = 0; i < 10; i++) {
        const hHeight = 15 + Math.random() * 25;
        const bGeo = new THREE.BoxGeometry(16, hHeight, 16);
        const bMat = new THREE.MeshLambertMaterial({ color: colorHex });
        const building = new THREE.Mesh(bGeo, bMat);
        const side = (i % 2 === 0) ? 32 : -32;
        building.position.set(side, hHeight / 2, z + (i * 25) - 100);
        building.castShadow = true;
        cityGroup.add(building);
      }

      // Placa na Entrada
      const signGeo = new THREE.BoxGeometry(14, 5, 0.6);
      const signMat = new THREE.MeshLambertMaterial({ color: 0x166534 });
      const sign = new THREE.Mesh(signGeo, signMat);
      sign.position.set(18, 9, z + 60);
      cityGroup.add(sign);

      const postGeo = new THREE.CylinderGeometry(0.4, 0.4, 9);
      const postMat = new THREE.MeshLambertMaterial({ color: 0x475569 });
      const post = new THREE.Mesh(postGeo, postMat);
      post.position.set(18, 4.5, z + 60);
      cityGroup.add(post);

      scene.add(cityGroup);
    }

    // Criando as Cidades do Paraná na Estrada
    createCity(0, 'Curitiba', 0x0284c7);
    createCity(-2000, 'Ponta Grossa', 0x7c3aed);
    createCity(-4200, 'Guarapuava', 0xd97706);
    createCity(-6500, 'Cascavel', 0x059669);

    // Casa em Curitiba
    const housePos = new THREE.Vector3(25, 3.5, -20);
    const houseGeo = new THREE.BoxGeometry(12, 7, 12);
    const houseMat = new THREE.MeshLambertMaterial({ color: 0xf59e0b });
    const house = new THREE.Mesh(houseGeo, houseMat);
    house.position.copy(housePos);
    house.castShadow = true;
    scene.add(house);

    // --- PERSONAGEM E CARRO ---
    // Jogador
    const playerGeo = new THREE.BoxGeometry(1.2, 2.4, 1.2);
    const playerMat = new THREE.MeshLambertMaterial({ color: 0x3b82f6 });
    const player = new THREE.Mesh(playerGeo, playerMat);
    player.position.set(6, 1.2, 0);
    player.castShadow = true;
    scene.add(player);

    // Carro
    const carGroup = new THREE.Group();
    const carBodyGeo = new THREE.BoxGeometry(3.4, 1.6, 6.5);
    const carBodyMat = new THREE.MeshLambertMaterial({ color: 0xef4444 });
    const carBody = new THREE.Mesh(carBodyGeo, carBodyMat);
    carBody.position.y = 1;
    carBody.castShadow = true;
    carGroup.add(carBody);

    // Faróis do Carro (SpotLights)
    const headlightLeft = new THREE.SpotLight(0xffffff, 0, 120, Math.PI / 5, 0.5);
    headlightLeft.position.set(-1.2, 1, -3);
    headlightLeft.target.position.set(-1.2, 0, -20);
    carGroup.add(headlightLeft);
    carGroup.add(headlightLeft.target);

    const headlightRight = new THREE.SpotLight(0xffffff, 0, 120, Math.PI / 5, 0.5);
    headlightRight.position.set(1.2, 1, -3);
    headlightRight.target.position.set(1.2, 0, -20);
    carGroup.add(headlightRight);
    carGroup.add(headlightRight.target);

    carGroup.position.set(-7, 0, 8);
    scene.add(carGroup);

    // --- CONTROLES DE TECLADO ---
    const keys = {};
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    window.addEventListener('keydown', e => {
      if (e.key.toLowerCase() === 'e') interactEnvironment();
      if (e.key.toLowerCase() === 'f') toggleHeadlights();
    });

    // --- SISTEMA DE AÇÕES E REGRAS ---
    function toggleHeadlights() {
      if (!gameState.inVehicle) {
        showToast("Você precisa estar no carro para ligar os faróis.");
        return;
      }
      gameState.headlightsOn = !gameState.headlightsOn;
      const intensity = gameState.headlightsOn ? 3.5 : 0;
      headlightLeft.intensity = intensity;
      headlightRight.intensity = intensity;
      showToast(gameState.headlightsOn ? "Faróis Ligados" : "Faróis Desligados");
    }

    function workJob() {
      if (gameState.energy < 15) {
        showToast("Você está muito cansado! Descanse em casa.");
        return;
      }
      gameState.money += 250;
      gameState.energy -= 15;
      updateUI();
      showToast("Trabalho concluído: +R$ 250");
    }

    function interactEnvironment() {
      const distCar = player.position.distanceTo(carGroup.position);
      const distHouse = player.position.distanceTo(housePos);

      // Entrar/Sair do Carro
      if (distCar < 7) {
        gameState.inVehicle = !gameState.inVehicle;
        player.visible = !gameState.inVehicle;
        showToast(gameState.inVehicle ? "Dirigindo! Pressione W para acelerar." : "Você saiu do veículo.");
        return;
      }

      // Alugar/Recuperar Energia na Casa
      if (distHouse < 9 && !gameState.inVehicle) {
        if (!gameState.rentedHouse) {
          if (gameState.money >= 1500) {
            gameState.money -= 1500;
            gameState.rentedHouse = true;
            houseMat.color.setHex(0x22c55e);
            showToast("Casa Alugada em Curitiba!");
          } else {
            showToast("Dinheiro insuficiente para aluguel (R$ 1.500)");
          }
        } else {
          gameState.energy = 100;
          showToast("Você descansou em casa! Energia 100%.");
        }
        updateUI();
      }
    }

    function updateUI() {
      document.getElementById('money-display').innerText = `R$ ${gameState.money.toLocaleString('pt-BR')}`;
      document.getElementById('energy-val').innerText = `${Math.round(gameState.energy)}%`;
      document.getElementById('energy-bar').style.width = `${gameState.energy}%`;
      document.getElementById('job-display').innerText = gameState.job;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.opacity = 1;
      setTimeout(() => toast.style.opacity = 0, 3000);
    }

    // --- LOOP PRINCIPAL (ANIMAÇÃO, FÍSICA E DIA/NOITE) ---
    function animate() {
      requestAnimationFrame(animate);

      // --- CICLO DIA E NOITE (Relógio Interno) ---
      gameState.timeOfDay = (gameState.timeOfDay + 0.003) % 24;
      const hours = Math.floor(gameState.timeOfDay);
      const minutes = Math.floor((gameState.timeOfDay % 1) * 60);
      document.getElementById('time-display').innerText = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;

      // Posição do Sol e Cor do Céu conforme o horário
      const sunAngle = (gameState.timeOfDay / 24) * Math.PI * 2;
      sun.position.x = Math.cos(sunAngle) * 300;
      sun.position.y = Math.sin(sunAngle) * 300;

      const isNight = gameState.timeOfDay < 6 || gameState.timeOfDay > 18;
      const skyColor = isNight ? new THREE.Color(0x090d16) : new THREE.Color(0x38bdf8);
      scene.background.lerp(skyColor, 0.02);
      scene.fog.color.lerp(skyColor, 0.02);
      sun.intensity = isNight ? 0.05 : 1.0;

      // --- MOVIMENTAÇÃO ---
      if (!gameState.inVehicle) {
        // A pé
        const speed = keys['shift'] ? 0.38 : 0.2;
        if (keys['w'] || keys['arrowup']) player.position.z -= speed;
        if (keys['s'] || keys['arrowdown']) player.position.z += speed;
        if (keys['a'] || keys['arrowleft']) player.position.x -= speed;
        if (keys['d'] || keys['arrowright']) player.position.x += speed;

        camera.position.set(player.position.x, player.position.y + 6, player.position.z + 15);
        camera.lookAt(player.position);
        document.getElementById('speedometer').innerText = "A pé";
      } else {
        // Dirigindo o Carro
        if (keys['w'] || keys['arrowup']) {
          gameState.speed = Math.min(gameState.speed + 0.03, gameState.maxSpeed);
        } else if (keys['s'] || keys['arrowdown']) {
          gameState.speed = Math.max(gameState.speed - 0.05, -0.4);
        } else {
          gameState.speed *= 0.97;
        }

        if (keys['a'] || keys['arrowleft']) carGroup.rotation.y += 0.03;
        if (keys['d'] || keys['arrowright']) carGroup.rotation.y -= 0.03;

        carGroup.translateZ(-gameState.speed);
        player.position.copy(carGroup.position);

        // Câmera dinâmica do carro
        const camOffset = new THREE.Vector3(0, 7, 20).applyMatrix4(carGroup.matrixWorld);
        camera.position.copy(camOffset);
        camera.lookAt(carGroup.position);

        const kmh = Math.round(Math.abs(gameState.speed) * 120);
        document.getElementById('speedometer').innerText = `${kmh} km/h`;
      }

      // --- GPS E LOCALIZAÇÃO EM TEMPO REAL NA RODOVIA ---
      const posZ = gameState.inVehicle ? carGroup.position.z : player.position.z;
      let city = 'Na Rodovia BR';
      let nextText = '';

      if (posZ > -1000) {
        city = 'Curitiba';
        nextText = `Próxima: Ponta Grossa (${Math.round(Math.abs(posZ - (-2000)))}m)`;
      } else if (posZ <= -1000 && posZ > -3100) {
        city = 'Ponta Grossa';
        nextText = `Próxima: Guarapuava (${Math.round(Math.abs(posZ - (-4200)))}m)`;
      } else if (posZ <= -3100 && posZ > -5350) {
        city = 'Guarapuava';
        nextText = `Próxima: Cascavel (${Math.round(Math.abs(posZ - (-6500)))}m)`;
      } else if (posZ <= -5350) {
        city = 'Cascavel';
        nextText = 'Fim do Trecho Principal';
      }

      document.getElementById('location-name').innerText = city;
      document.getElementById('gps-next').innerText = nextText;

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
