<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Simulador de Vida - Mobile RP</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; user-select: none; background: #000; touch-action: none; }
    
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 12px;
      z-index: 10;
    }
    .stat-val { color: #4ade80; font-weight: bold; }

    /* Controles Virtuais para Celular */
    #mobile-controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(3, 50px);
      gap: 5px;
      z-index: 10;
    }
    .dpad-btn {
      background: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 8px;
      color: white;
      font-weight: bold;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dpad-btn:active { background: rgba(255, 255, 255, 0.6); }

    #action-panel {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    #toast {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #22c55e;
      color: white;
      padding: 10px;
      border-radius: 5px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 20;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="hud">
    <div id="location-name" style="font-weight:bold; color:#38bdf8; margin-bottom:5px;">Curitiba</div>
    <div>Dinheiro: <span class="stat-val" id="money">R$ 5.000</span></div>
    <div>Status: <span id="status">A pé</span></div>
  </div>

  <!-- D-Pad para Celular -->
  <div id="mobile-controls">
    <div></div><div class="dpad-btn" id="btn-up">▲</div><div></div>
    <div class="dpad-btn" id="btn-left">◀</div><div></div><div class="dpad-btn" id="btn-right">▶</div>
    <div></div><div class="dpad-btn" id="btn-down">▼</div><div></div>
  </div>

  <div id="action-panel">
    <button class="btn" onclick="interact()">🚪 Entrar / Interagir</button>
  </div>

  <div id="toast">Notificação</div>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xffffff, 0.8);
    sun.position.set(50, 100, 50);
    sun.castShadow = true;
    scene.add(sun);

    // Chão
    const groundGeo = new THREE.PlaneGeometry(1000, 3000);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x16a34a });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Estrada
    const roadGeo = new THREE.PlaneGeometry(20, 3000);
    const roadMat = new THREE.MeshLambertMaterial({ color: 0x334155 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.y = 0.01;
    scene.add(road);

    // --- CONSTRUÇÃO DO AVATAR ---
    const playerGroup = new THREE.Group();
    // Cabeça
    const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
    const headMat = new THREE.MeshLambertMaterial({ color: 0xffdbac });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 1.6;
    playerGroup.add(head);
    // Corpo
    const bodyGeo = new THREE.BoxGeometry(0.8, 1, 0.4);
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x2563eb });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.9;
    playerGroup.add(body);

    playerGroup.position.set(3, 0, 0);
    scene.add(playerGroup);

    // --- CONSTRUÇÃO DO VEÍCULO ---
    const carGroup = new THREE.Group();
    const carBodyGeo = new THREE.BoxGeometry(2.2, 1, 4);
    const carBodyMat = new THREE.MeshLambertMaterial({ color: 0xdc2626 });
    const carBody = new THREE.Mesh(carBodyGeo, carBodyMat);
    carBody.position.y = 0.6;
    carGroup.add(carBody);

    // Rodas
    const wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 16);
    const wheelMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    for (let x of [-1.1, 1.1]) {
      for (let z of [-1.2, 1.2]) {
        const w = new THREE.Mesh(wheelGeo, wheelMat);
        w.rotation.z = Math.PI / 2;
        w.position.set(x, 0.3, z);
        carGroup.add(w);
      }
    }
    carGroup.position.set(-4, 0, 5);
    scene.add(carGroup);

    // --- CASA COM INTERIOR COM ENTRADA ---
    const houseGroup = new THREE.Group();
    // Paredes
    const wallMat = new THREE.MeshLambertMaterial({ color: 0xf3f4f6 });
    const backWall = new THREE.Mesh(new THREE.BoxGeometry(8, 4, 0.2), wallMat);
    backWall.position.set(0, 2, -4);
    houseGroup.add(backWall);

    const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, 8), wallMat);
    leftWall.position.set(-4, 2, 0);
    houseGroup.add(leftWall);

    const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, 8), wallMat);
    rightWall.position.set(4, 2, 0);
    houseGroup.add(rightWall);

    houseGroup.position.set(12, 0, -10);
    scene.add(houseGroup);

    // ESTADO E CONTROLES
    let inCar = false;
    let moveForward = false, moveBackward = false, turnLeft = false, turnRight = false;

    // Mapeamento dos botões virtuais
    const bindBtn = (id, setter) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); setter(true); });
      el.addEventListener('touchend', (e) => { e.preventDefault(); setter(false); });
    };

    bindBtn('btn-up', val => moveForward = val);
    bindBtn('btn-down', val => moveBackward = val);
    bindBtn('btn-left', val => turnLeft = val);
    bindBtn('btn-right', val => turnRight = val);

    function interact() {
      const distCar = playerGroup.position.distanceTo(carGroup.position);
      if (distCar < 4) {
        inCar = !inCar;
        playerGroup.visible = !inCar;
        document.getElementById('status').innerText = inCar ? 'Dirigindo' : 'A pé';
        showToast(inCar ? "Entrou no carro" : "Saiu do carro");
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.opacity = 1;
      setTimeout(() => toast.style.opacity = 0, 2500);
    }

    function animate() {
      requestAnimationFrame(animate);

      if (!inCar) {
        if (moveForward) playerGroup.translateZ(-0.15);
        if (moveBackward) playerGroup.translateZ(0.15);
        if (turnLeft) playerGroup.rotation.y += 0.04;
        if (turnRight) playerGroup.rotation.y -= 0.04;

        camera.position.set(playerGroup.position.x, playerGroup.position.y + 4, playerGroup.position.z + 8);
        camera.lookAt(playerGroup.position);
      } else {
        if (moveForward) carGroup.translateZ(-0.3);
        if (moveBackward) carGroup.translateZ(0.1);
        if (turnLeft) carGroup.rotation.y += 0.03;
        if (turnRight) carGroup.rotation.y -= 0.03;

        playerGroup.position.copy(carGroup.position);

        camera.position.set(carGroup.position.x, carGroup.position.y + 5, carGroup.position.z + 10);
        camera.lookAt(carGroup.position);
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
